name: deploy-gh-page

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04 || ubuntu-latest

    env:
      ARENA_RUNTIME: ${{ vars.ARENA_RUNTIME || (vars.API_URL && 'python' || 'browser') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install Node
        run: npm ci

      - name: Install Rust
        if: env.ARENA_RUNTIME == 'browser'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install WASM
        if: env.ARENA_RUNTIME == 'browser'
        run: cargo install wasm-bindgen-cli --locked --version 0.2.130

      - name: Verify
        run: npm run verify:all

      - name: Build
        env:
          GITHUB_REPO: ${{ github.repository }}
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_WS_URL: ${{ vars.WS_URL }}
          VITE_RUNTIME: ${{ env.ARENA_RUNTIME }}
          VITE_BROWSER_DEVICE: ${{ vars.BROWSER_DEVICE || 'wasm' }}
        run: npm run build:pages

      - name: Config
        uses: actions/configure-pages@v6

      - name: Upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-26.04 || ubuntu-latest

    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
