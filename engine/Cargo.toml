[workspace]
members = ["core", "wasm"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"

[workspace.dependencies]
arena-core = { path = "core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_bytes = "0.11.19"
thiserror = "2.0.21"
ts-rs = { version = "12.0.1", features = ["serde-compat", "no-serde-warnings"] }

[workspace.lints.rust]
unsafe_code = "forbid"
[workspace.lints.clippy]
all = "warn"
[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"

[profile.release.package.arena-core]
opt-level = 3
